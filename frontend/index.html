<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeFi Super App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f1a; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        h1 { text-align: center; color: #7c3aed; margin-bottom: 30px; font-size: 2rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; margin: 0 auto; }
        .card { background: #1a1a2e; border-radius: 12px; padding: 20px; border: 1px solid #2d2d4e; }
        .card h2 { color: #7c3aed; margin-bottom: 15px; font-size: 1.1rem; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #0f0f1a; border: 1px solid #3d3d6e; border-radius: 8px; color: #fff; font-size: 14px; }
        button { width: 100%; padding: 12px; margin: 5px 0; background: #7c3aed; border: none; border-radius: 8px; color: #fff; font-size: 14px; cursor: pointer; font-weight: bold; }
        button:hover { background: #6d28d9; }
        button.connect { background: #059669; font-size: 1rem; padding: 15px; margin-bottom: 20px; max-width: 900px; display: block; margin-left: auto; margin-right: auto; }
        .status { padding: 10px; border-radius: 8px; margin: 8px 0; font-size: 13px; word-break: break-all; }
        .success { background: #064e3b; color: #6ee7b7; }
        .error { background: #7f1d1d; color: #fca5a5; }
        .info { background: #1e3a5f; color: #93c5fd; }
        .wallet-info { text-align: center; margin-bottom: 20px; max-width: 900px; margin-left: auto; margin-right: auto; }
        .wallet-info p { color: #a78bfa; font-size: 14px; margin: 4px 0; }
        .full-width { grid-column: 1 / -1; }
        .proposal { background: #0f0f1a; border-radius: 8px; padding: 10px; margin: 5px 0; font-size: 13px; }
    </style>
</head>
<body>

<h1>🚀 DeFi Super App</h1>

<button class="connect" onclick="connectWallet()">🦊 Connect MetaMask</button>

<div class="wallet-info" id="walletInfo" style="display:none">
    <p>👛 Address: <span id="walletAddress">-</span></p>
    <p>💰 ETH Balance: <span id="ethBalance">-</span></p>
    <p>🪙 TokenA Balance: <span id="tokenBalance">-</span></p>
    <p>🗳️ Voting Power: <span id="votingPower">-</span></p>
</div>

<div class="grid">

    <!-- AMM SWAP -->
    <div class="card">
        <h2>💱 Swap Tokens (AMM)</h2>
        <input type="number" id="swapAmount" placeholder="Amount of TokenA to swap">
        <button onclick="swapTokens()">Swap TokenA → TokenB</button>
        <div id="swapStatus"></div>
    </div>

    <!-- VAULT -->
    <div class="card">
        <h2>🏦 Vault (ERC-4626)</h2>
        <input type="number" id="depositAmount" placeholder="Amount to deposit">
        <button onclick="depositVault()">Deposit to Vault</button>
        <input type="number" id="withdrawAmount" placeholder="Shares to withdraw">
        <button onclick="withdrawVault()" style="background:#dc2626">Withdraw from Vault</button>
        <div id="vaultStatus"></div>
    </div>

    <!-- GOVERNANCE -->
    <div class="card">
        <h2>🗳️ Governance</h2>
        <button onclick="delegateVotes()">Delegate Votes to Myself</button>
        <div id="govStatus"></div>
        <div style="margin-top:15px">
            <h3 style="color:#a78bfa; font-size:0.9rem; margin-bottom:8px">Active Proposals</h3>
            <div id="proposalList">
                <div class="proposal">No proposals yet</div>
            </div>
        </div>
    </div>

    <!-- LIQUIDITY -->
    <div class="card">
        <h2>💧 Add Liquidity</h2>
        <input type="number" id="liqAmountA" placeholder="Amount TokenA">
        <input type="number" id="liqAmountB" placeholder="Amount TokenB">
        <button onclick="addLiquidity()">Add Liquidity</button>
        <div id="liqStatus"></div>
    </div>

    <!-- POOL INFO -->
    <div class="card full-width">
        <h2>📊 Pool Info (from subgraph)</h2>
        <button onclick="loadPoolInfo()" style="background:#0369a1">Load Pool Reserves</button>
        <div id="poolInfo" style="margin-top:10px; font-size:13px; color:#93c5fd"></div>
    </div>

</div>

<script>
    // ===== CONTRACT ADDRESSES =====
    const ADDRESSES = {
        tokenA: "0x65fCe7D7786d8307358352aC976F400605DAd019",
        tokenB: "0x76D1115f4C4E85E8eeB6De10DC38486Ecd65cb1D",
        amm:    "0x78571D874Cf73178dD51A3dF641FaDDcbC3D129e",
        vault:  "0x302C61061b82d8Db7A23A6b058fbFE79C25AbD43",
    };

    const BASE_SEPOLIA_CHAIN_ID = "0x14A34"; // 84532

    // ===== ABIs =====
    const ERC20_ABI = [
        "function balanceOf(address) view returns (uint256)",
        "function approve(address, uint256) returns (bool)",
        "function transfer(address, uint256) returns (bool)",
        "function getVotes(address) view returns (uint256)",
        "function delegate(address) returns ()",
        "function decimals() view returns (uint8)"
    ];

    const AMM_ABI = [
        "function swapAtoB(uint256, uint256) returns (uint256)",
        "function addLiquidity(uint256, uint256) returns (uint256)",
        "function reserveA() view returns (uint256)",
        "function reserveB() view returns (uint256)"
    ];

    const VAULT_ABI = [
        "function deposit(uint256, address) returns (uint256)",
        "function withdraw(uint256, address, address) returns (uint256)",
        "function balanceOf(address) view returns (uint256)",
        "function totalAssets() view returns (uint256)"
    ];

    let provider, signer, userAddress;
    let tokenA, tokenB, amm, vault;

    // ===== CONNECT WALLET =====
    async function connectWallet() {
        try {
            if (!window.ethereum) {
                alert("MetaMask not found! Please install MetaMask.");
                return;
            }

            // Проверяем сеть
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });
            if (chainId !== BASE_SEPOLIA_CHAIN_ID) {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: BASE_SEPOLIA_CHAIN_ID }],
                    });
                } catch (e) {
                    // Добавляем сеть если не найдена
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: BASE_SEPOLIA_CHAIN_ID,
                            chainName: 'Base Sepolia',
                            nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                            rpcUrls: ['https://sepolia.base.org'],
                            blockExplorerUrls: ['https://sepolia.basescan.org']
                        }]
                    });
                }
            }

            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();

            // Инициализируем контракты
            tokenA = new ethers.Contract(ADDRESSES.tokenA, ERC20_ABI, signer);
            tokenB = new ethers.Contract(ADDRESSES.tokenB, ERC20_ABI, signer);
            amm = new ethers.Contract(ADDRESSES.amm, AMM_ABI, signer);
            vault = new ethers.Contract(ADDRESSES.vault, VAULT_ABI, signer);

            await updateBalances();
            document.getElementById('walletInfo').style.display = 'block';
            document.querySelector('.connect').textContent = '✅ Connected!';
            document.querySelector('.connect').style.background = '#064e3b';

        } catch (e) {
            alert("Error: " + e.message);
        }
    }

    // ===== UPDATE BALANCES =====
    async function updateBalances() {
        try {
            const ethBal = await provider.getBalance(userAddress);
            const tokenBal = await tokenA.balanceOf(userAddress);
            const votes = await tokenA.getVotes(userAddress);

            document.getElementById('walletAddress').textContent =
                userAddress.slice(0,6) + '...' + userAddress.slice(-4);
            document.getElementById('ethBalance').textContent =
                parseFloat(ethers.formatEther(ethBal)).toFixed(4) + ' ETH';
            document.getElementById('tokenBalance').textContent =
                parseFloat(ethers.formatEther(tokenBal)).toFixed(2) + ' DGT';
            document.getElementById('votingPower').textContent =
                parseFloat(ethers.formatEther(votes)).toFixed(2) + ' votes';
        } catch(e) {
            console.error(e);
        }
    }

    // ===== SWAP =====
    async function swapTokens() {
        const statusEl = document.getElementById('swapStatus');
        try {
            const amount = document.getElementById('swapAmount').value;
            if (!amount) return showStatus(statusEl, 'Enter amount!', 'error');

            showStatus(statusEl, 'Approving...', 'info');
            const amountWei = ethers.parseEther(amount);

            const approveTx = await tokenA.approve(ADDRESSES.amm, amountWei);
            await approveTx.wait();

            showStatus(statusEl, 'Swapping...', 'info');
            const swapTx = await amm.swapAtoB(amountWei, 0);
            await swapTx.wait();

            showStatus(statusEl, '✅ Swap successful!', 'success');
            await updateBalances();
        } catch(e) {
            showStatus(statusEl, '❌ ' + (e.reason || e.message), 'error');
        }
    }

    // ===== DEPOSIT VAULT =====
    async function depositVault() {
        const statusEl = document.getElementById('vaultStatus');
        try {
            const amount = document.getElementById('depositAmount').value;
            if (!amount) return showStatus(statusEl, 'Enter amount!', 'error');

            showStatus(statusEl, 'Approving...', 'info');
            const amountWei = ethers.parseEther(amount);

            const approveTx = await tokenA.approve(ADDRESSES.vault, amountWei);
            await approveTx.wait();

            showStatus(statusEl, 'Depositing...', 'info');
            const depositTx = await vault.deposit(amountWei, userAddress);
            await depositTx.wait();

            showStatus(statusEl, '✅ Deposited!', 'success');
            await updateBalances();
        } catch(e) {
            showStatus(statusEl, '❌ ' + (e.reason || e.message), 'error');
        }
    }

    // ===== WITHDRAW VAULT =====
    async function withdrawVault() {
        const statusEl = document.getElementById('vaultStatus');
        try {
            const amount = document.getElementById('withdrawAmount').value;
            if (!amount) return showStatus(statusEl, 'Enter amount!', 'error');

            showStatus(statusEl, 'Withdrawing...', 'info');
            const amountWei = ethers.parseEther(amount);
            const tx = await vault.withdraw(amountWei, userAddress, userAddress);
            await tx.wait();

            showStatus(statusEl, '✅ Withdrawn!', 'success');
            await updateBalances();
        } catch(e) {
            showStatus(statusEl, '❌ ' + (e.reason || e.message), 'error');
        }
    }

    // ===== DELEGATE =====
    async function delegateVotes() {
        const statusEl = document.getElementById('govStatus');
        try {
            showStatus(statusEl, 'Delegating...', 'info');
            const tx = await tokenA.delegate(userAddress);
            await tx.wait();
            showStatus(statusEl, '✅ Votes delegated!', 'success');
            await updateBalances();
        } catch(e) {
            showStatus(statusEl, '❌ ' + (e.reason || e.message), 'error');
        }
    }

    // ===== ADD LIQUIDITY =====
    async function addLiquidity() {
        const statusEl = document.getElementById('liqStatus');
        try {
            const amountA = document.getElementById('liqAmountA').value;
            const amountB = document.getElementById('liqAmountB').value;
            if (!amountA || !amountB) return showStatus(statusEl, 'Enter both amounts!', 'error');

            const amountAWei = ethers.parseEther(amountA);
            const amountBWei = ethers.parseEther(amountB);

            showStatus(statusEl, 'Approving TokenA...', 'info');
            await (await tokenA.approve(ADDRESSES.amm, amountAWei)).wait();

            showStatus(statusEl, 'Approving TokenB...', 'info');
            await (await tokenB.approve(ADDRESSES.amm, amountBWei)).wait();

            showStatus(statusEl, 'Adding liquidity...', 'info');
            const tx = await amm.addLiquidity(amountAWei, amountBWei);
            await tx.wait();

            showStatus(statusEl, '✅ Liquidity added!', 'success');
        } catch(e) {
            showStatus(statusEl, '❌ ' + (e.reason || e.message), 'error');
        }
    }

    // ===== POOL INFO =====
    async function loadPoolInfo() {
        const el = document.getElementById('poolInfo');
        try {
            if (!amm) { el.textContent = 'Connect wallet first!'; return; }
            const resA = await amm.reserveA();
            const resB = await amm.reserveB();
            const totalVaultAssets = await vault.totalAssets();
            el.innerHTML = `
                <p>📦 Reserve TokenA: ${parseFloat(ethers.formatEther(resA)).toFixed(4)}</p>
                <p>📦 Reserve TokenB: ${parseFloat(ethers.formatEther(resB)).toFixed(4)}</p>
                <p>🏦 Vault Total Assets: ${parseFloat(ethers.formatEther(totalVaultAssets)).toFixed(4)}</p>
            `;
        } catch(e) {
            el.textContent = 'Error: ' + e.message;
        }
    }

    // ===== HELPER =====
    function showStatus(el, msg, type) {
        el.innerHTML = `<div class="status ${type}">${msg}</div>`;
    }
</script>

</body>
</html>

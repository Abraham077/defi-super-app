specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AMM
    network: base-sepolia
    source:
      address: "0x78571D874Cf73178dD51A3dF641FaDDcbC3D129e"
      abi: AMM
      startBlock: 41617401
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Swap
        - LiquidityEvent
        - PoolState
      abis:
        - name: AMM
          file: ./abis/AMM.json
      eventHandlers:
        - event: Swap(indexed address,uint256,uint256,bool)
          handler: handleSwap
        - event: LiquidityAdded(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityAdded
      file: ./src/mappings.ts
  - kind: ethereum
    name: Vault
    network: base-sepolia
    source:
      address: "0x302C61061b82d8Db7A23A6b058fbFE79C25AbD43"
      abi: Vault
      startBlock: 41617401
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - VaultDeposit
      abis:
        - name: Vault
          file: ./abis/Vault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleVaultDeposit
      file: ./src/mappings.ts